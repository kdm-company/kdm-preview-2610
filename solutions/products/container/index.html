<script>
(() => {
  const SALT = 'IwVTVlMvUZAXDYU9nRkAlg==', ITER = 600000, K = 'pv-2610-k';
  const dec = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const enc = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
  const data = dec(document.getElementById('pv').textContent.trim());
  const form = document.querySelector('.gate');
  const err = form.querySelector('.err');
  const open = async (raw) => {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
    const html = new TextDecoder().decode(plain);
    // 読み込み途中に document.open すると無視されて追記になるため、解析が終わってから差し替える
    if (document.readyState === 'loading') await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
    document.open(); document.write(html); document.close();
  };
  const remember = (raw) => { try { localStorage.setItem(K, JSON.stringify({ k: enc(raw), exp: Date.now() + 7 * 864e5 })); } catch (e) {} };
  const saved = () => { try { const v = JSON.parse(localStorage.getItem(K) || 'null'); if (v && v.exp > Date.now()) return dec(v.k); localStorage.removeItem(K); } catch (e) {} return null; };
  const show = () => { form.hidden = false; form.pw.focus(); };
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button'); btn.disabled = true; err.textContent = '';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(form.pw.value), 'PBKDF2', false, ['deriveBits']);
      const raw = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: dec(SALT), iterations: ITER }, base, 256);
      await open(raw); remember(raw);
    } catch (x) { err.textContent = 'パスワードが違います。'; btn.disabled = false; form.pw.select(); }
  });
  const raw = saved();
  if (raw) open(raw).catch(() => { try { localStorage.removeItem(K); } catch (e) {} show(); }); else show();
})();
</script>
